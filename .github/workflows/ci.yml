name: CI

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-test:
    name: Build, Test and Validate Containers
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build and test with Maven
        run: ./mvnw --batch-mode verify

      - name: Build Blue Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=1.0 \
            --build-arg APP_ENVIRONMENT=blue \
            -t bluegreen-app:v1 .

      - name: Build Green Docker image
        run: |
          docker build \
            --build-arg APP_VERSION=2.0 \
            --build-arg APP_ENVIRONMENT=green \
            -t bluegreen-app:v2 .

      - name: Test Blue container
        run: |
          docker run -d \
            --name blue-ci \
            -p 8080:8080 \
            bluegreen-app:v1

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              break
            fi

            sleep 2
          done

          curl -fsS http://localhost:8080/api/version \
            | grep '"environment":"blue"'

          curl -fsS http://localhost:8080/api/version \
            | grep '"version":"1.0"'

          docker rm -f blue-ci

      - name: Test Green container
        run: |
          docker run -d \
            --name green-ci \
            -p 8080:8080 \
            bluegreen-app:v2

          for i in {1..30}; do
            if curl -fsS http://localhost:8080/actuator/health; then
              break
            fi

            sleep 2
          done

          curl -fsS http://localhost:8080/api/version \
            | grep '"environment":"green"'

          curl -fsS http://localhost:8080/api/version \
            | grep '"version":"2.0"'

          docker rm -f green-ci

      - name: Log in to GitHub Container Registry
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
          docker login ghcr.io \
            -u "${{ github.actor }}" \
            --password-stdin

      - name: Publish Blue image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            bluegreen-app:v1 \
            ghcr.io/rohan-hc/springboot-blue-green-k8s:v1

          docker push \
            ghcr.io/rohan-hc/springboot-blue-green-k8s:v1

      - name: Publish Green image to GHCR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag \
            bluegreen-app:v2 \
            ghcr.io/rohan-hc/springboot-blue-green-k8s:v2

          docker push \
            ghcr.io/rohan-hc/springboot-blue-green-k8s:v2