apiVersion: apps/v1
kind: Deployment

metadata:
  name: green-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bluegreen
      version: green

  template:
    metadata:
      labels:
        app: bluegreen
        version: green

    spec:
      containers:
        - name: bluegreen-app
          image: bluegreen-app:v2
          imagePullPolicy: Never

          ports:
            - containerPort: 8080

          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5