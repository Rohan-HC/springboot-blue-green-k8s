containers:
  - name: bluegreen-app
    image: bluegreen-app:v2
    imagePullPolicy: Never

    ports:
      - containerPort: 8080

    livenessProbe:
      httpGet:
        path: /actuator/health/liveness
        port: 8080
      initialDelaySeconds: 10
      periodSeconds: 10

    readinessProbe:
      httpGet:
        path: /actuator/health/readiness
        port: 8080
      initialDelaySeconds: 5
      periodSeconds: 5