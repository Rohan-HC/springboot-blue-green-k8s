apiVersion: apps/v1
kind: Deployment

metadata:
  name: blue-deployment

spec:
  replicas: 2

  selector:
    matchLabels:
      app: bluegreen
      version: blue

  template:
    metadata:
      labels:
        app: bluegreen
        version: blue

    spec:
      containers:
        - name: bluegreen-app
          image: bluegreen-app:v1
          imagePullPolicy: Never

          ports:
            - containerPort: 8080